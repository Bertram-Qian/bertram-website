name: Deploy to GitHub Pages

# The site used to be four static files served straight off `main`. It is now a
# Vite build, so Pages has to run the build rather than serve the repo root.
#
# ONE MANUAL STEP the first time: GitHub → Settings → Pages → Build and
# deployment → Source must be changed from "Deploy from a branch" to
# "GitHub Actions". Until that is done this workflow will build but not publish.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy that's already publishing; queue behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
